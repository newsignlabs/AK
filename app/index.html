<!doctype html>
<html lang="en" class="no-js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--app-head-->
    <script>
      // Before paint: mark JS, and skip the preloader on repeat visits or reduced motion.
      (function (d) {
        d.className = d.className.replace('no-js', 'js');
        try {
          if (sessionStorage.getItem('ak:preloaded') || matchMedia('(prefers-reduced-motion: reduce)').matches)
            d.dataset.preloaded = 'true';
        } catch (e) {
          d.dataset.preloaded = 'true';
        }
      })(document.documentElement);
    </script>
    <noscript><style>[data-reveal]{opacity:1!important;transform:none!important;clip-path:none!important}.preloader{display:none!important}</style></noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
